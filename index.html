<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f4">
  <meta name="description" content="A private sign-in interface demo with a moon-themed hero image and dashboard redirect.">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f4; --panel: #fff; --ink: #17251e; --muted: #64736a;
      --line: #d7e0da; --accent: #176b4d; --accent-hover: #10583e;
      --accent-ink: #fff; --soft: #eaf3ed; --error: #b3261e;
      --success: #176b4d; --shadow: 0 24px 70px rgb(21 48 34 / 10%);
      --radius: 22px; font-synthesis: none;
    }
    :root[data-theme="dark"] {
      color-scheme: dark; --bg: #101713; --panel: #19231d; --ink: #edf4ef;
      --muted: #a4b2a9; --line: #34443a; --accent: #65d4a7;
      --accent-hover: #85e2bb; --accent-ink: #0b2117; --soft: #20352a;
      --error: #ff958c; --success: #81ddb2; --shadow: 0 24px 70px rgb(0 0 0 / 28%);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark; --bg: #101713; --panel: #19231d; --ink: #edf4ef;
        --muted: #a4b2a9; --line: #34443a; --accent: #65d4a7;
        --accent-hover: #85e2bb; --accent-ink: #0b2117; --soft: #20352a;
        --error: #ff958c; --success: #81ddb2; --shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      min-height: 100vh; min-height: 100svh; margin: 0;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 10% 12%, rgb(91 183 131 / 13%), transparent 34rem), radial-gradient(ellipse at 95% 90%, rgb(79 145 171 / 10%), transparent 32rem), var(--bg);
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55; transition: background-color 180ms ease, color 180ms ease;
    }
    button, input { font: inherit; } button { color: inherit; }
    .shell { width: min(100%, 470px); animation: rise-in 500ms cubic-bezier(.2, .75, .25, 1) both; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; padding-inline: 4px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: .96rem; font-weight: 700; letter-spacing: -.02em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: var(--accent); color: var(--accent-ink); }
    .theme-toggle, .password-toggle { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .theme-toggle { min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: .85rem; font-weight: 600; transition: border-color 160ms ease, transform 160ms ease; }
    .theme-toggle:hover { border-color: var(--accent); transform: translateY(-1px); }
    .hero-art {
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--soft);
      box-shadow: var(--shadow);
    }
    .hero-art img { display: block; width: 100%; height: 200px; object-fit: cover; }
    .hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px 18px 16px;
      background: linear-gradient(180deg, rgb(5 13 16 / 0) 30%, rgb(5 13 16 / 52%) 100%);
      color: #fff;
    }
    .hero-kicker {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .88;
    }
    .hero-name {
      margin-top: 4px;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -.06em;
    }
    .card { overflow: hidden; padding: clamp(24px, 7vw, 38px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); transition: background-color 180ms ease, border-color 180ms ease; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; color: var(--accent); font-size: .76rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: currentColor; content: ""; }
    h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.25rem); line-height: 1.15; letter-spacing: -.045em; }
    .intro { margin: 12px 0 24px; color: var(--muted); font-size: .98rem; }
    .field { margin: 0 0 18px; }
    label { display: block; margin: 0 0 7px; font-size: .9rem; font-weight: 650; }
    .input-wrap { position: relative; }
    input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: var(--panel); color: var(--ink); transition: border-color 160ms ease, box-shadow 160ms ease; }
    input::placeholder { color: var(--muted); opacity: .8; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    .password-input { padding-right: 76px; }
    .password-toggle { position: absolute; top: 50%; right: 8px; padding: 7px 9px; border-radius: 8px; font-size: .82rem; font-weight: 650; transform: translateY(-50%); }
    .password-toggle:hover { background: var(--soft); color: var(--ink); }
    .primary-button { width: 100%; min-height: 50px; border: 0; border-radius: 12px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 700; transition: background-color 160ms ease, transform 160ms ease; }
    .primary-button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .status { min-height: 1.6em; margin: 12px 0 0; color: var(--muted); font-size: .9rem; }
    .status[data-kind="error"] { color: var(--error); }
    .status[data-kind="success"] { color: var(--success); }
    .footer { margin: 16px 4px 0; color: var(--muted); font-size: .77rem; text-align: center; }
    [hidden] { display: none !important; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 420px) { body { place-items: start center; padding-top: max(16px, env(safe-area-inset-top, 0px)); } .shell { margin-block: auto; } .card { border-radius: 18px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="musarrat"><span class="brand-mark" aria-hidden="true">M</span><span>musarrat</span></div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">Use dark mode</button>
    </header>

    <div class="hero-art" aria-label="Moon image">
      <img src="https://images.unsplash.com/photo-1502134249126-9f3755a50d78?auto=format&fit=crop&w=1200&q=80" alt="Moon in the night sky">
      <div class="hero-overlay">
        <span class="hero-kicker">Welcome</span>
        <strong class="hero-name">musarrat</strong>
      </div>
    </div>

    <section class="card" aria-labelledby="pageTitle">
      <p class="eyebrow">Welcome back</p>
      <h1 id="pageTitle">Sign in</h1>
      <p class="intro">Enter your details to continue.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="username" placeholder="Your name" required minlength="2" maxlength="80" autofocus>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8">
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <button class="primary-button" type="submit">Continue</button>
        <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p class="footer">A static demo interface</p>
  </main>

  <script>
    "use strict";
    const byId = (id) => document.getElementById(id);
    const loginForm = byId("loginForm");
    const nameInput = byId("name");
    const passwordInput = byId("password");
    const loginStatus = byId("loginStatus");
    const passwordToggle = byId("passwordToggle");
    const themeToggle = byId("themeToggle");

    function setStatus(element, message, kind = "") {
      element.textContent = message;
      if (kind) element.dataset.kind = kind;
      else delete element.dataset.kind;
    }

    passwordToggle.addEventListener("click", () => {
      const shouldShow = passwordInput.type === "password";
      passwordInput.type = shouldShow ? "text" : "password";
      passwordToggle.textContent = shouldShow ? "Hide" : "Show";
      passwordToggle.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      setStatus(loginStatus, "");

      const name = nameInput.value.trim();
      if (name.length < 2) {
        nameInput.setCustomValidity("Enter a name with at least 2 characters.");
        nameInput.reportValidity();
        setStatus(loginStatus, "Please enter a name with at least 2 characters.", "error");
        return;
      }
      nameInput.setCustomValidity("");

      if (!passwordInput.value) {
        passwordInput.setCustomValidity("Enter a password.");
        passwordInput.reportValidity();
        setStatus(loginStatus, "Please enter a password.", "error");
        return;
      }
      if (passwordInput.value.length < 8) {
        passwordInput.setCustomValidity("Use at least 8 characters for this demo field.");
        passwordInput.reportValidity();
        setStatus(loginStatus, "The demo password must be at least 8 characters.", "error");
        return;
      }
      passwordInput.setCustomValidity("");
      passwordInput.value = "";

      const nextPage = `dashboard.html?name=${encodeURIComponent(name)}`;
      window.location.href = nextPage;
    });

    nameInput.addEventListener("input", () => nameInput.setCustomValidity(""));
    passwordInput.addEventListener("input", () => passwordInput.setCustomValidity(""));

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const isDark = theme === "dark";
      themeToggle.textContent = isDark ? "Use light mode" : "Use dark mode";
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    const savedTheme = (() => {
      try { return localStorage.getItem("login-demo-theme"); } catch { return null; }
    })();
    applyTheme(savedTheme === "dark" ? "dark" : "light");

    themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
      try { localStorage.setItem("login-demo-theme", nextTheme); } catch {}
    });
  </script>
</body>
</html>
